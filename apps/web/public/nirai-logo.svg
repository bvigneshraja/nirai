<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5AC8FA"/>
      <stop offset="100%" stop-color="#0050D5"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="white" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card">
      <rect width="100" height="100" rx="22"/>
    </clipPath>
  </defs>
  <!-- Background -->
  <rect width="100" height="100" rx="22" fill="url(#bg)"/>
  <!-- Top shine -->
  <rect width="100" height="50" fill="url(#shine)" clip-path="url(#card)"/>
  <!-- N — left vertical -->
  <rect x="14" y="16" width="14" height="58" rx="3" fill="white"/>
  <!-- N — right vertical -->
  <rect x="62" y="16" width="14" height="58" rx="3" fill="white"/>
  <!-- N — diagonal -->
  <polygon points="28,16 46,16 76,74 58,74" fill="white"/>
  <!-- Grain dots — three circles suggesting fullness/granary (Nirai = நிறை) -->
  <circle cx="67" cy="61" r="4.2" fill="rgba(0,64,200,0.50)"/>
  <circle cx="73.5" cy="53" r="4.2" fill="rgba(0,64,200,0.38)"/>
  <circle cx="60.5" cy="53" r="4.2" fill="rgba(0,64,200,0.32)"/>
</svg>
